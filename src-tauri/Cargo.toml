[package]
name = "meta"
version = "0.0.1"
description = "metatron"
authors = ["fufu"]
edition = "2024"
default-run = "meta"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meta"
path = "src/main.rs"

[[bin]]
name = "cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[patch.crates-io]
tauri-plugin-decoration = { path = "vendor/tauri-plugin-decoration" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-decoration = "3.0.5"

tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }

toasty = { version = "0.9", features = ["sqlite", "serde"] }
toasty-cli = "0.9"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
